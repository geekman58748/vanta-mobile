<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Must match --color-ink: this is the Android status bar / WebView surround.
         Also mirrors the shell's splash_background in android/.../colors.xml. -->
    <meta name="theme-color" content="#060509" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Type is self-hosted from src/assets/fonts (see index.css). No Google
         Fonts request, so first paint has no external round-trip and no
         fallback-glyph swap, and the app renders with zero network. -->
    <title>Vanta · Privacy Wallet</title>
    <style>
      body { background: #060509; margin: 0; }
    </style>
  </head>
  <body class="bg-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
