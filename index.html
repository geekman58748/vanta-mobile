<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Must match --color-ink: this is the Android status bar / WebView surround.
         Also mirrors the shell's splash_background in android/.../colors.xml. -->
    <meta name="theme-color" content="#060509" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Type is self-hosted from src/assets/fonts (see index.css). No Google
         Fonts request, so first paint has no external round-trip and no
         fallback-glyph swap, and the app renders with zero network. -->
    <title>Vanta · Privacy Wallet</title>
    <style>
      body { background: #060509; margin: 0; }
    </style>
    <!-- Node's `process`, for the browser bundle.

         The Zolana SDK's TEE attestation path (@phala/dcap-qvl) is CommonJS and pulls
         in crypto-browserify, whose modules read `process.browser`, `process.versions`
         and `process.nextTick` — and one of those reads (`!process.browser && …`) sits at
         MODULE SCOPE, so it is evaluated the moment the chunk loads, not inside a
         `typeof process !== 'undefined'` guard. Vite's `define` only rewrites
         `process.env`; a bare `process` needs the real global to exist or the WebView
         throws `ReferenceError: process is not defined` while the SDK chunk evaluates.
         When that happens the privacy engine never initialises, the app reports
         "Privacy init failed", and Shield/Ghost are dead — with nothing in the UI saying
         why. `browser: true` and an empty `versions` keep the Node-detection branches in
         the Solana libraries on their browser paths (no `versions.node`, so `isNode`
         stays false). -->
    <script>
      window.process =
        window.process ||
        {
          browser: true,
          env: {},
          version: '',
          versions: {},
          platform: 'browser',
          nextTick: (fn, ...args) => queueMicrotask(() => fn(...args)),
        }
    </script>
  </head>
  <body class="bg-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
