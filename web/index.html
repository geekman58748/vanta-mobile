<!DOCTYPE html>
<html lang="en" class="h-full bg-[#07090E] text-white antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANTA — Session Privacy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231FAE7A' d='M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.2 7.3l-5 5a1 1 0 0 1-1.4 0l-2-2a1 1 0 1 1 1.4-1.4l1.3 1.29 4.3-4.3a1 1 0 0 1 1.4 1.41z'/%3E%3C/svg%3E" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            tech: ['"Orbitron"', 'sans-serif'],
          },
          colors: {
            mvpn: {
              bg: '#080A0F',
              card: '#11141D',
              purple: '#7B61FF',
              'purple-dark': '#5534EA',
              teal: '#1FAE7A',
              'teal-dark': '#12633F',
              red: '#FF4D4D',
              gold: '#D9B36A',
              'gold-light': '#F3D9A6',
              'gold-dark': '#8A6A2F',
              graphite: '#211D30',
              'graphite-deep': '#121020',
            }
          },
          boxShadow: {
            'power-glow': '0 0 2px 1px rgba(160, 140, 210, 0.18), 0 12px 34px 4px rgba(20, 14, 40, 0.55), inset 0 1.5px 1.5px rgba(255,255,255,0.16), inset 0 -14px 22px rgba(0,0,0,0.5)',
            'teal-glow': '0 0 20px 2px rgba(31, 174, 122, 0.30)',
            'flag-glow': '0 0 18px 3px rgba(238, 220, 185, 0.30)',
            'gold-glow': '0 0 22px 3px rgba(217, 179, 106, 0.38)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Background Teal Wave & Matrix Overlay */
    .bg-matrix {
      background-image: radial-gradient(rgba(31, 174, 122, 0.14) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }

    .teal-wave-bg {
      background: radial-gradient(circle at 50% 63%, rgba(235, 208, 156, 0.10) 0%, rgba(31, 174, 122, 0.20) 16%, rgba(18, 99, 63, 0.09) 36%, rgba(8, 10, 15, 0) 70%);
    }

    .power-btn-gradient {
      background: linear-gradient(155deg, #423C63 0%, #241F38 55%, #131120 100%);
      position: relative;
      isolation: isolate;
    }
    .power-btn-gradient::before {
      content: '';
      position: absolute;
      inset: 1.5px;
      border-radius: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.03) 32%, rgba(255,255,255,0) 55%);
      pointer-events: none;
      z-index: 0;
    }
    .power-btn-gradient > * {
      position: relative;
      z-index: 1;
    }
    .icon-glow-on {
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.75)) drop-shadow(0 0 12px rgba(255,255,255,0.35));
    }

    /* Soft dark recessed squircle sitting behind the power button, matching reference */
    .halo-effect {
      background: rgba(9, 8, 14, 0.62);
      filter: blur(14px);
      transition: opacity 0.3s ease;
    }

    .premium-badge-gradient {
      background: linear-gradient(135deg, #F3D9A6 0%, #D9B36A 45%, #96742F 100%);
      position: relative;
      overflow: hidden;
    }
    .premium-badge-gradient::after {
      content: '';
      position: absolute;
      top: 0; left: -60%;
      width: 35%; height: 100%;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.65) 50%, transparent 100%);
      transform: skewX(-20deg);
      animation: premium-shimmer 5.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes premium-shimmer {
      0%   { left: -60%; }
      30%  { left: 130%; }
      100% { left: 130%; }
    }

    /* Pulse animation for connected state */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.18); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .pulse-effect {
      animation: pulse-ring 3s infinite ease-in-out;
    }

    /* Custom scrollbar for game/stream view */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080A0F;
    }
    ::-webkit-scrollbar-thumb {
      background: #1F2432;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2D3448;
    }

    /* Smooth Tab Transitions */
    .view-panel {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="h-full w-full flex flex-col bg-[#07090E] overflow-x-hidden select-none">

  <!-- Grain + vignette: the difference between "dark UI" and "expensive dark UI" is
       usually this layer -- flat black reads cheap, a faint texture and uneven
       light falloff reads like a physical, considered surface. -->
  <div class="pointer-events-none fixed inset-0 z-[60]" style="opacity:0.05; mix-blend-mode:overlay; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>'); background-size:140px 140px;"></div>
  <div class="pointer-events-none fixed inset-0 z-[59]" style="background: radial-gradient(130% 85% at 50% 18%, transparent 55%, rgba(0,0,0,0.45) 100%);"></div>

  <header class="w-full max-w-5xl mx-auto px-4 sm:px-8 pt-6 pb-2 flex items-center justify-between z-20">
    <!-- Brand Mark (icon only -- the wordmark read as generic template branding) -->
    <div class="flex items-center cursor-pointer group" onclick="switchTab('main')">
      <div class="relative w-9 h-9 flex items-center justify-center">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="transform transition-transform group-hover:scale-105">
          <!-- Polygon 1 -->
          <path d="M4 8L16 2L16 16L4 22V8Z" fill="#7B61FF" />
          <!-- Polygon 2 -->
          <path d="M16 16L28 10V24L16 30V16Z" fill="#5B38FD" />
        </svg>
      </div>
    </div>

    <!-- Center Navigation Switches (Desktop/Tablet) -->
    <div class="hidden sm:flex items-center bg-[#121622] border border-[#1E2538] p-1 rounded-full">
      <button id="nav-btn-main" onclick="switchTab('main')" class="px-5 py-2 text-xs font-bold rounded-full transition-all duration-200 bg-[#7B61FF] text-white shadow-md">
        Main Console
      </button>
      <button id="nav-btn-stream" onclick="switchTab('stream')" class="px-5 py-2 text-xs font-semibold rounded-full text-gray-400 hover:text-white transition-all duration-200">
        Sessions
      </button>
    </div>

    <!-- Right Top Badge: SKR Tier -->
    <button class="premium-badge-gradient hover:brightness-105 transition-all px-4 py-2 rounded-full flex items-center space-x-2 shadow-gold-glow">
      <svg class="w-4 h-4 text-[#3A2A12] fill-current" viewBox="0 0 24 24">
        <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
      </svg>
      <span class="text-xs font-bold tracking-wide text-[#3A2A12]">SKR Tier</span>
    </button>
  </header>

  <!-- Mobile Screen Navigation Tabs -->
  <div class="flex sm:hidden justify-center my-3 px-4 z-20">
    <div class="flex w-full bg-[#121622] border border-[#1E2538] p-1 rounded-xl">
      <button id="mobile-btn-main" onclick="switchTab('main')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-[#7B61FF] text-white transition-all">
        Shield
      </button>
      <button id="mobile-btn-stream" onclick="switchTab('stream')" class="flex-1 py-2 text-xs font-semibold text-gray-400 hover:text-white transition-all">
        Sessions
      </button>
    </div>
  </div>

  <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 relative flex flex-col justify-between py-2">

    <!-- ================= VIEW 1: MAIN SHIELD INTERFACE ================= -->
    <div id="view-main" class="view-panel w-full flex-1 flex flex-col justify-between items-center relative z-10 py-4">
      
      <!-- Background Ambient Dot Matrix & Glow Effect -->
      <div class="absolute inset-0 bg-matrix opacity-40 pointer-events-none rounded-3xl"></div>
      <div class="absolute inset-0 teal-wave-bg pointer-events-none"></div>
      <div id="worldmap3d" class="absolute left-0 right-0 pointer-events-none overflow-hidden" style="top: 22%; height: 46%;"></div>

      <!-- Curved black cutout: path is computed in JS from the power button's real
           size/position so the bowl stays proportional to the button at every
           breakpoint instead of a fixed viewBox percentage. -->
      <div id="wave-cut" class="absolute inset-x-0 bottom-0 flex flex-col pointer-events-none" style="z-index:5;">
        <svg id="wave-svg" class="w-full shrink-0 block" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="flex-1 bg-[#07090E]"></div>
      </div>

      <!-- Top Shield Status Badge -->
      <div class="mt-2 sm:mt-4 z-10">
        <button id="status-badge" onclick="toggleVPN()" class="flex items-center space-x-2 bg-gray-800 text-gray-400 px-5 py-1.5 rounded-full font-bold text-xs tracking-wide transition-all duration-300 hover:scale-105">
          <svg id="status-icon" class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM13.707 8.707a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <span id="status-text">Exposed</span>
        </button>
      </div>

      <div class="w-full max-w-md grid grid-cols-3 gap-2 my-6 sm:my-8 text-center z-10">
        <!-- Tx Routed -->
        <div class="flex flex-col items-center">
          <div class="flex items-center space-x-1.5 text-[#1FAE7A] mb-1">
            <svg class="w-4 h-4 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
            </svg>
          </div>
          <div class="text-2xl sm:text-3xl font-semibold tracking-tight font-tech text-white" id="stat-download">0</div>
          <div class="text-[10px] font-semibold text-gray-500 mt-0.5 uppercase tracking-[0.15em]">txs routed</div>
        </div>

        <!-- SOL Shielded -->
        <div class="flex flex-col items-center">
          <div class="flex items-center space-x-1.5 text-[#9B9689] mb-1">
            <svg class="w-4 h-4 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
            </svg>
          </div>
          <div class="text-2xl sm:text-3xl font-semibold tracking-tight font-tech text-white" id="stat-upload">0.000</div>
          <div class="text-[10px] font-semibold text-gray-500 mt-0.5 uppercase tracking-[0.15em]">sol shielded</div>
        </div>

        <!-- Spend Cap -->
        <div class="flex flex-col items-center">
          <div class="flex items-center space-x-1.5 text-[#B8AD8A] mb-1">
            <!-- Signal Bars Icon -->
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <rect x="2" y="16" width="3" height="5" rx="1"/>
              <rect x="7" y="12" width="3" height="9" rx="1"/>
              <rect x="12" y="8" width="3" height="13" rx="1"/>
              <rect x="17" y="4" width="3" height="17" rx="1"/>
            </svg>
          </div>
          <div class="text-2xl sm:text-3xl font-semibold tracking-tight font-tech text-white" id="stat-ping">0.000</div>
          <div class="text-[10px] font-semibold text-gray-500 mt-0.5 uppercase tracking-[0.15em]">spend cap</div>
        </div>
      </div>

      <div class="relative my-4 sm:my-8 flex items-center justify-center z-10">
        <!-- Soft Recessed Squircle Halo (button sits inset within it) -->
        <div id="power-pulse" style="opacity:0" class="absolute w-56 h-56 sm:w-64 sm:h-64 rounded-[3.75rem] halo-effect pointer-events-none"></div>

        <!-- Power Button Container -->
        <button id="power-btn" onclick="toggleVPN()" class="relative w-36 h-36 sm:w-40 sm:h-40 rounded-[2.2rem] bg-gray-800 shadow-none border border-gray-700 flex items-center justify-center transition-all duration-300 hover:scale-105 opacity-80 cursor-pointer focus:outline-none">
          <!-- Power Icon -->
          <svg id="power-icon" class="w-14 h-14 text-white stroke-[2.5] transition-transform duration-300 group-hover:scale-110" style="transition: transform 0.3s, filter 0.3s ease;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/>
          </svg>
        </button>
      </div>

      <div class="w-full max-w-lg flex flex-col items-center mt-6 z-10">
        <!-- Wallet Circle Carousel -->
        <div class="flex items-center justify-center space-x-3 sm:space-x-5 my-4 overflow-x-auto py-2 w-full px-2 no-scrollbar">

          <!-- Backpack -->
          <div onclick="selectServer('Backpack', 'BP', 110)" class="flag-item cursor-pointer transform hover:scale-110 transition-all opacity-50 hover:opacity-100 flex-shrink-0">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full overflow-hidden border border-gray-700 flex items-center justify-center bg-[#1B1A20] shadow">
              <svg class="w-5 h-5" viewBox="0 0 21 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 10.5907C0 10.5907 0 0 9.81681 0C20.3109 0 20.3109 10.5907 20.3109 10.5907V28H0V10.5907Z" fill="url(#bp-grad)"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M8.41764 10.3004H4.35547V23.6476H8.41764V10.3004ZM15.9613 13.202C15.9613 14.8045 14.6622 16.1035 13.0598 16.1035C11.4573 16.1035 10.1582 14.8045 10.1582 13.202C10.1582 11.5995 11.4573 10.3004 13.0598 10.3004C14.6622 10.3004 15.9613 11.5995 15.9613 13.202ZM15.9613 20.7459C15.9613 22.3484 14.6622 23.6475 13.0598 23.6475C11.4573 23.6475 10.1582 22.3484 10.1582 20.7459C10.1582 19.1434 11.4573 17.8444 13.0598 17.8444C14.6622 17.8444 15.9613 19.1434 15.9613 20.7459Z" fill="white"/>
                <defs>
                  <linearGradient id="bp-grad" x1="20.3109" y1="0" x2="2.79233" y2="29.6498" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#A773F6"/>
                    <stop offset="1" stop-color="#14B8A6"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
          </div>

          <!-- Phantom -->
          <div onclick="selectServer('Phantom', 'PH', 45)" class="flag-item cursor-pointer transform hover:scale-110 transition-all opacity-50 hover:opacity-100 flex-shrink-0">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full overflow-hidden border border-gray-700 flex items-center justify-center shadow">
              <svg class="w-full h-full" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="108" height="108" rx="54" fill="#AB9FF2"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M46.5267 69.9229C42.0054 76.8509 34.4292 85.6182 24.348 85.6182C19.5824 85.6182 15 83.6563 15 75.1342C15 53.4305 44.6326 19.8327 72.1268 19.8327C87.768 19.8327 94 30.6846 94 43.0079C94 58.8258 83.7355 76.9122 73.5321 76.9122C70.2939 76.9122 68.7053 75.1342 68.7053 72.314C68.7053 71.5783 68.8275 70.7812 69.0719 69.9229C65.5893 75.8699 58.8685 81.3878 52.5754 81.3878C47.993 81.3878 45.6713 78.5063 45.6713 74.4598C45.6713 72.9884 45.9768 71.4556 46.5267 69.9229ZM83.6761 42.5794C83.6761 46.1704 81.5575 47.9658 79.1875 47.9658C76.7816 47.9658 74.6989 46.1704 74.6989 42.5794C74.6989 38.9885 76.7816 37.1931 79.1875 37.1931C81.5575 37.1931 83.6761 38.9885 83.6761 42.5794ZM70.2103 42.5795C70.2103 46.1704 68.0916 47.9658 65.7216 47.9658C63.3157 47.9658 61.233 46.1704 61.233 42.5795C61.233 38.9885 63.3157 37.1931 65.7216 37.1931C68.0916 37.1931 70.2103 38.9885 70.2103 42.5795Z" fill="#FFFDf8"/>
              </svg>
            </div>
          </div>

          <!-- Solflare -->
          <div onclick="selectServer('Solflare', 'SF', 92)" class="flag-item cursor-pointer transform hover:scale-110 transition-all opacity-50 hover:opacity-100 flex-shrink-0">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full overflow-hidden border border-gray-700 flex items-center justify-center shadow">
              <svg class="w-full h-full" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="50" height="50" rx="25" fill="#ffef46"/>
                <path d="M24.23,26.42l2.46-2.38,4.59,1.5c3.01,1,4.51,2.84,4.51,5.43,0,1.96-.75,3.26-2.25,4.93l-.46,.5,.17-1.17c.67-4.26-.58-6.09-4.72-7.43l-4.3-1.38h0ZM18.05,11.85l12.52,4.17-2.71,2.59-6.51-2.17c-2.25-.75-3.01-1.96-3.3-4.51v-.08h0ZM17.3,33.06l2.84-2.71,5.34,1.75c2.8,.92,3.76,2.13,3.46,5.18l-11.65-4.22h0ZM13.71,20.95c0-.79,.42-1.54,1.13-2.17,.75,1.09,2.05,2.05,4.09,2.71l4.42,1.46-2.46,2.38-4.34-1.42c-2-.67-2.84-1.67-2.84-2.96M26.82,42.87c9.18-6.09,14.11-10.23,14.11-15.32,0-3.38-2-5.26-6.43-6.72l-3.34-1.13,9.14-8.77-1.84-1.96-2.71,2.38-12.81-4.22c-3.97,1.29-8.97,5.09-8.97,8.89,0,.42,.04,.83,.17,1.29-3.3,1.88-4.63,3.63-4.63,5.8,0,2.05,1.09,4.09,4.55,5.22l2.75,.92-9.52,9.14,1.84,1.96,2.96-2.71,14.73,5.22h0Z" stroke="#02050a" stroke-miterlimit="10" stroke-width="0.5"/>
              </svg>
            </div>
          </div>

          <!-- Seed Vault (Selected Default in Center) -->
          <div id="selected-flag-container" onclick="selectServer('Seed Vault', 'SV', 80)" class="flag-item cursor-pointer transform hover:scale-110 transition-all flex-shrink-0 relative">
            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full p-1 bg-gradient-to-b from-gray-200 to-gray-500 shadow-flag-glow flex items-center justify-center">
              <div class="w-full h-full rounded-full overflow-hidden border-2 border-black flex items-center justify-center bg-[#0B0F1A]">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="5" y="10.5" width="14" height="10" rx="2.5" stroke="#14F195" stroke-width="1.8"/>
                  <path d="M8 10.5V7.5C8 5 9.5 3.5 12 3.5C14.5 3.5 16 5 16 7.5V10.5" stroke="#14F195" stroke-width="1.8" stroke-linecap="round"/>
                  <circle cx="12" cy="15.5" r="1.6" fill="#14F195"/>
                </svg>
              </div>
            </div>
          </div>

          <!-- Jupiter -->
          <div onclick="selectServer('Jupiter', 'JU', 142)" class="flag-item cursor-pointer transform hover:scale-110 transition-all opacity-50 hover:opacity-100 flex-shrink-0">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full overflow-hidden border border-gray-700 flex items-center justify-center bg-[#C7C3D9] shadow">
              <svg class="w-6 h-6" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.5 24.5L14.5 8.5C15.1 7.3 16.9 7.3 17.5 8.5L25.5 24.5" stroke="#0B0F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10 24.5L16 12.5L22 24.5" stroke="#0B0F1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>

          <!-- Coinbase Wallet -->
          <div onclick="selectServer('Coinbase Wallet', 'CB', 55)" class="flag-item cursor-pointer transform hover:scale-110 transition-all opacity-50 hover:opacity-100 flex-shrink-0">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full overflow-hidden border border-gray-700 flex items-center justify-center bg-[#0052FF] shadow">
              <svg class="w-6 h-6" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="16" r="16" fill="#0052FF"/>

  <script>
    // Relayer endpoint resolution, in priority order:
    //   1. ?relayer= query param (wins, sticks in localStorage)
    //   2. previously-bound relayer in localStorage
    //   3. the production relayer, when the page itself is deployed (any
    //      non-localhost origin) — deployed site works with zero config
    //   4. localhost:8787 for local dev
    (function () {
      const q = new URLSearchParams(location.search).get('relayer');
      if (q) { try { localStorage.setItem('vanta_relayer', q); } catch (e) {} }
      let stored = null;
      try { stored = localStorage.getItem('vanta_relayer'); } catch (e) {}
      const host = location.hostname;
      const isLocal = host === 'localhost' || host === '127.0.0.1' || host === '';
      const PROD_RELAYER = 'https://vanta-mobile-8ee4.onrender.com';
      window.VANTA_RELAYER_URL = q || stored || (isLocal ? 'http://localhost:8787' : PROD_RELAYER);
    })();
  </script>
  <script src="vanta-engine.js"></script>
  <script>
    // App State Management — the engine is the source of truth; isConnected
    // only mirrors engine.state for the UI branches below.
    let engine = null;
    try {
      engine = new VantaSessionEngine();
    } catch (err) {
      // vanta-engine.js missing or failed: keep the page alive and report it
      // from the toggle instead of dying mid-block (which would leave every
      // handler's lets in the temporal dead zone and the whole UI dead).
      console.error('Vanta engine init failed:', err);
    }
    let isConnected = false;
    let statusPoll = null;

    // DEV STAND-IN for the main wallet pubkey. Replaced by the real
    // MWA/Seed Vault connect flow (next integration step). The session key
    // itself is real: generated in-memory, signed, verified by the relayer.
    const DEV_MAIN_PUBKEY = VantaEngine.b58encode(
      crypto.getRandomValues(new Uint8Array(32))
    );

    const fmtSOL = (lamports) => (lamports / 1e9).toFixed(3);

    function setStat(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function setBadge(kind, label, title) {
      const badge = document.getElementById('status-badge');
      const text = document.getElementById('status-text');
      if (title) badge.title = title; else badge.removeAttribute('title');
      if (kind === 'on') {
        badge.className = "flex items-center space-x-2 bg-white/[0.03] backdrop-blur-sm border border-[#1FAE7A]/50 text-[#4FD69C] px-5 py-1.5 rounded-full font-bold text-xs tracking-[0.1em] uppercase shadow-teal-glow transition-all duration-300 hover:scale-105";
      } else if (kind === 'busy') {
        badge.className = "flex items-center space-x-2 bg-amber-500/10 backdrop-blur-sm text-amber-300 border border-amber-400/40 px-5 py-1.5 rounded-full font-bold text-xs tracking-[0.1em] uppercase transition-all duration-300";
      } else if (kind === 'error') {
        badge.className = "flex items-center space-x-2 bg-red-500/10 backdrop-blur-sm text-red-300 border border-red-400/40 px-5 py-1.5 rounded-full font-bold text-xs tracking-[0.1em] uppercase transition-all duration-300";
      } else {
        badge.className = "flex items-center space-x-2 bg-gray-800 text-gray-400 px-5 py-1.5 rounded-full font-bold text-xs tracking-wide transition-all duration-300 hover:scale-105";

      text.textContent = label;
    }

    function setPowerUi(on) {
      const powerBtn = document.getElementById('power-btn');
      const powerPulse = document.getElementById('power-pulse');
      const powerIcon = document.getElementById('power-icon');
      powerPulse.style.opacity = on ? '1' : '0';
      if (window.setWorldMapActive) window.setWorldMapActive(on);
      powerBtn.className = on
        ? "relative w-36 h-36 sm:w-40 sm:h-40 rounded-[2.2rem] power-btn-gradient shadow-power-glow flex items-center justify-center transition-all duration-300 hover:scale-105 active:scale-95 group cursor-pointer"
        : "relative w-36 h-36 sm:w-40 sm:h-40 rounded-[2.2rem] bg-gray-800 shadow-none border border-gray-700 flex items-center justify-center transition-all duration-300 hover:scale-105 opacity-80 cursor-pointer";
      powerIcon.classList.toggle('icon-glow-on', on);
    }

    function setShieldedUi(on, stats) {
      isConnected = on;
      setPowerUi(on);
      if (on) {
        setBadge('on', 'Shielded');
        setStat('stat-download', '0');
        setStat('stat-upload', fmtSOL(stats.spentLamports || 0));
        setStat('stat-ping', fmtSOL(stats.spendCapLamports || 0));
        startStatusPoll();
      } else {
        setBadge('off', 'Exposed');
        setStat('stat-download', '0');
        setStat('stat-upload', '0.000');
        setStat('stat-ping', '0.000');
        stopStatusPoll();
      }
    }

    // Real status from the relayer every 5s while a session is live.
    function startStatusPoll() {
      stopStatusPoll();
      statusPoll = setInterval(async () => {
        const s = await engine.status();
        if (!s.active || !s.session) return;
        setStat('stat-upload', fmtSOL(s.session.spentLamports || 0));
      }, 5000);
    }
    function stopStatusPoll() {
      if (statusPoll) { clearInterval(statusPoll); statusPoll = null; }
    }

    // Toggle active screen tab
    let isSwitching = false;
    function switchTab(tab) {
      const viewMain = document.getElementById('view-main');
      const viewStream = document.getElementById('view-stream');
      
      const navMain = document.getElementById('nav-btn-main');
      const navStream = document.getElementById('nav-btn-stream');
      const mobileMain = document.getElementById('mobile-btn-main');
      const mobileStream = document.getElementById('mobile-btn-stream');

      const showEl = tab === 'main' ? viewMain : viewStream;
      const hideEl = tab === 'main' ? viewStream : viewMain;

      if (isSwitching || showEl.classList.contains('flex')) return;
      isSwitching = true;

      if (tab === 'main') {
        navMain.className = "px-5 py-2 text-xs font-bold rounded-full transition-all duration-200 bg-[#7B61FF] text-white shadow-md";
        navStream.className = "px-5 py-2 text-xs font-semibold rounded-full text-gray-400 hover:text-white transition-all duration-200";
        mobileMain.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-[#7B61FF] text-white transition-all";
        mobileStream.className = "flex-1 py-2 text-xs font-semibold text-gray-400 hover:text-white transition-all";
      } else {
        navStream.className = "px-5 py-2 text-xs font-bold rounded-full transition-all duration-200 bg-[#7B61FF] text-white shadow-md";
        navMain.className = "px-5 py-2 text-xs font-semibold rounded-full text-gray-400 hover:text-white transition-all duration-200";
        mobileStream.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-[#7B61FF] text-white transition-all";
        mobileMain.className = "flex-1 py-2 text-xs font-semibold text-gray-400 hover:text-white transition-all";
      }

      // smooth crossfade: ease the current panel out and down slightly, swap
      // display once it's invisible, then ease the new panel in from the same
      // offset -- a plain hidden/flex snap read cheap next to everything else
      hideEl.style.transition = 'opacity 0.22s cubic-bezier(0.4,0,1,1), transform 0.22s cubic-bezier(0.4,0,1,1)';
      hideEl.style.opacity = '0';
      hideEl.style.transform = 'translateY(10px) scale(0.98)';

      setTimeout(() => {
        hideEl.classList.add('hidden');
        hideEl.classList.remove('flex');
        hideEl.style.transition = '';

        showEl.classList.remove('hidden');
        showEl.classList.add('flex');
        showEl.style.transition = 'none';
        showEl.style.opacity = '0';
        showEl.style.transform = 'translateY(10px) scale(0.98)';

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            showEl.style.transition = 'opacity 0.32s cubic-bezier(0.16,1,0.3,1), transform 0.32s cubic-bezier(0.16,1,0.3,1)';
            showEl.style.opacity = '1';
            showEl.style.transform = 'translateY(0) scale(1)';
            setTimeout(() => { isSwitching = false; }, 340);
          });
        });
      }, 220);
    }

    // Smoothly tween a stat number from its current displayed value to a new
    // one instead of snapping -- an instant text swap on live-updating numbers
    // reads jittery/cheap next to everything else that eases.
    const numberTweens = new WeakMap();
    function animateNumber(el, to, duration = 450) {
      if (!el) return;
      const from = parseFloat(el.textContent) || 0;
      to = parseFloat(to);
      if (from === to) { el.textContent = to; return; }

      if (numberTweens.has(el)) cancelAnimationFrame(numberTweens.get(el));

      const start = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3); // ease-out cubic
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const val = from + (to - from) * ease(t);
        el.textContent = Math.round(val);
        if (t < 1) {
          numberTweens.set(el, requestAnimationFrame(tick));
        } else {
          el.textContent = to;
          numberTweens.delete(el);
        }
      }
      numberTweens.set(el, requestAnimationFrame(tick));
    }

    // Toggle Shield Session State — drives the REAL session engine.
    let toggling = false;
    async function toggleVPN() {
      if (toggling) return;
      if (!engine) {
        setBadge('error', 'Engine not loaded', 'vanta-engine.js failed to load — hard refresh (Cmd+Shift+R)');
        setTimeout(() => { if (!isConnected) setBadge('off', 'Exposed'); }, 3000);
        return;
      }
      toggling = true;
      try {
        if (isConnected) {
          setBadge('busy', 'Revoking...');
          const off = await engine.shieldOff();
          setShieldedUi(false);
          if (off.revoked && off.unspentLamports != null) {
            // unspent headroom returned — surface it in the SOL stat for a beat
            setStat('stat-upload', fmtSOL(off.unspentLamports));
          }
        } else {
          setBadge('busy', 'Provisioning...');
          const on = await engine.shieldOn(DEV_MAIN_PUBKEY);
          setShieldedUi(true, { spentLamports: 0, spendCapLamports: on.spendCapLamports });
        }
      } catch (err) {
        // Nothing was provisioned (engine wipes on failure) — show why, then
        // settle back into the truthful Exposed state.
        setBadge('error', 'Relayer unreachable', String(err && err.message || err));
        setShieldedUi(false);
        setTimeout(() => { if (!isConnected) setBadge('off', 'Exposed'); }, 2500);
      } finally {
        toggling = false;
      }
    }

    // Select Session Target (which wallet the session key fronts)
    function selectServer(name) {
      document.getElementById('current-server-name').textContent = name;
    }

    // Select Dedicated Streaming/Gaming server
    function selectDedicatedServer(service, location, ping) {
      const cleanPing = ping.replace('ms', '');
      selectServer(`${service} (${location})`, '', cleanPing);
      switchTab('main');
    }

    // Boot: the engine starts OFF, so the UI must too (no fake "Shielded" on
    // load — the badge, glow and map all settle into the Exposed state).
    // DOMContentLoaded: the Three.js map script (and its setWorldMapActive)
    // loads after this block, and the boot pass needs to dim it.
    document.addEventListener('DOMContentLoaded', () => setShieldedUi(false));
  </script>
  <script>
  /* The curve's proportions are derived from the power button itself (not a
     fixed % of screen width), so the bowl stays a graceful, wide "flowing"
     arc that hugs the button at any viewport - the earlier fixed-percentage
     version pinched narrow on small screens because the button doesn't
     shrink at the same rate as the container.

     Ratios below were measured directly off the reference screenshot:
       - total dip span  = 2.15x button width, centered on the button
       - max depth       = 0.162x dip span
       - flat shoulder above the dip sits ~6% of button width above the button's
         own baseline, giving the curve a touch of room to breathe before it
         starts easing downward (matches the reference's soft entry, not a hard L). */
  (function () {
    var wave = document.getElementById('wave-cut');
    var svg = document.getElementById('wave-svg');
    var btn = document.getElementById('power-btn');
    var host = document.getElementById('view-main');
    if (!wave || !svg || !btn || !host) return;

    var DIP_RATIO = 2.15;
    var DEPTH_RATIO = 0.162;
    var SHOULDER_PAD_RATIO = 0.05;
    var BOTTOM_PAD = 40; // extra flat black margin under the deepest point

    function build() {
      var hostRect = host.getBoundingClientRect();
      var btnRect = btn.getBoundingClientRect();
      if (!hostRect.width || !btnRect.width) return;

      var W = hostRect.width;
      var buttonWidth = btnRect.width;
      var centerX = (btnRect.left + btnRect.width / 2) - hostRect.left;

      var halfSpan = (buttonWidth * DIP_RATIO) / 2;
      var depth = halfSpan * 2 * DEPTH_RATIO;
      var flatY = Math.max(6, buttonWidth * SHOULDER_PAD_RATIO);
      var H = flatY + depth + BOTTOM_PAD;

      var leftX = Math.max(0, centerX - halfSpan);
      var rightX = Math.min(W, centerX + halfSpan);

      // symmetric ease in/out control points -- equal offsets on both ends of
      // each bezier segment is what actually keeps the curve a smooth bowl;
      // uneven offsets (my first attempt) made it flat-then-plunge, i.e. pointy
      var ease = halfSpan * 0.42;

      var d = [
        'M0,' + flatY,
        'L' + leftX + ',' + flatY,
        'C' + (leftX + ease) + ',' + flatY + ' ' + (centerX - ease) + ',' + (flatY + depth) + ' ' + centerX + ',' + (flatY + depth),
        'C' + (centerX + ease) + ',' + (flatY + depth) + ' ' + (rightX - ease) + ',' + flatY + ' ' + rightX + ',' + flatY,
        'L' + W + ',' + flatY,
        'L' + W + ',' + H,
        'L0,' + H,
        'Z'
      ].join(' ');

      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.height = H + 'px';
      svg.innerHTML = '<path d="' + d + '" fill="#07090E"></path>';

      // position the whole cutout so its flat line sits at the button's baseline
      var flatScreenTop = (btnRect.bottom - hostRect.top) - flatY;
      wave.style.top = Math.max(0, flatScreenTop) + 'px';
    }

    build();
    if (window.ResizeObserver) {
      new ResizeObserver(build).observe(host);
      new ResizeObserver(build).observe(btn);
    } else {
      window.addEventListener('resize', build);
    }
    window.addEventListener('load', build);
    setTimeout(build, 120);
    setTimeout(build, 400); // catch late web-font/layout shifts
    window.placeWaveCut = build;
  })();
  </script>

      'uniform vec2 uGlow;',
      'varying float vAlpha;',
      'varying float vGlow;',
      'void main() {',
      '  vec3 p = position;',
      // very slow breathing drift so the grain feels alive, not animated
      '  p.z += sin(uTime * 0.35 + aSeed) * 0.004;',
      '  float d = distance(p.xy, uGlow);',
      '  vGlow = smoothstep(0.42, 0.0, d);',
      '  vAlpha = aAlpha * (0.55 + 1.25 * vGlow);',
      '  vAlpha *= 0.88 + 0.12 * sin(uTime * 0.5 + aSeed);',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  gl_PointSize = uSize * uPixelRatio * (1.0 + vGlow * 0.35);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying float vAlpha;',
      'varying float vGlow;',
      'void main() {',
      '  vec2 uv = gl_PointCoord - 0.5;',
      '  float r = length(uv);',
      '  float mask = smoothstep(0.5, 0.15, r);',
      '  if (mask <= 0.001) discard;',
      // pale slate dots far out, warm teal near the glow -- matches reference
      '  vec3 cold = vec3(0.55, 0.58, 0.58);',
      '  vec3 warm = vec3(0.28, 0.72, 0.62);',
      '  vec3 gold = vec3(0.86, 0.74, 0.49);',
      '  vec3 col = mix(cold, warm, vGlow);',
      '  col = mix(col, gold, smoothstep(0.72, 1.0, vGlow) * 0.45);',
      '  gl_FragColor = vec4(col, mask * vAlpha * 1.15);',
      '}'
    ].join('\n')
  });

  var points = new THREE.Points(geo, mat);
  scene.add(points);

  function resize() {
    var w = host.clientWidth || 1;
    var h = host.clientHeight || 1;
    renderer.setSize(w, h, false);

    // cover-fit the map box into the host, biased so Americas->Asia span the width
    var hostAspect = w / h;
    var mapAspect = MAP_W / MAP_H;
    var viewW, viewH;
    if (hostAspect > mapAspect) {
      viewW = 1.0;
      viewH = 1.0 / hostAspect;
    } else {
      viewH = (MAP_H / MAP_W);
      viewW = viewH * hostAspect;
    }
    // zoom in slightly so the map bleeds past the edges like the reference
    var zoom = 0.82;
    camera.left = -viewW * zoom;
    camera.right = viewW * zoom;
    camera.top = viewH * zoom;
    camera.bottom = -viewH * zoom;
    camera.updateProjectionMatrix();

    mat.uniforms.uSize.value = Math.max(1.9, Math.min(3.4, w / 165));
  }

  var ro = window.ResizeObserver ? new ResizeObserver(resize) : null;
  if (ro) ro.observe(host); else window.addEventListener('resize', resize);
  resize();

  var start = performance.now();
  var running = true;
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) loop();
  });

  function loop() {
    if (!running) return;
    mat.uniforms.uTime.value = (performance.now() - start) / 1000;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();

  // dim the whole field when the VPN is toggled off
  window.setWorldMapActive = function (active) {
    host.style.transition = 'opacity 0.45s ease';
    host.style.opacity = active ? '1' : '0.35';
  };
})();

  </script>
</body>
</html>
